services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: delega
      POSTGRES_PASSWORD: delega
      POSTGRES_DB: delega
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://delega:delega@db:5432/delega
      SECRET_KEY: ${SECRET_KEY:-sviluppo-locale-cambiare-in-produzione-000}
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
