{% extends "base.html" %}
{% import "_macro.html" as m with context %}
{% set sezione = "clienti" %}
{% block titolo %}Nuovo cliente{% endblock %}
{% block contenuto %}
<p class="briciole"><a href="/studio/clienti">Clienti</a> /</p>
<h1>Nuovo cliente</h1>
<section class="pannello">
  <form method="post" action="/studio/clienti/nuovo" enctype="multipart/form-data">
    {{ m.csrf() }}
    <div class="caricamento">
      <label class="campo"><span>Documento d'identita' (facoltativo)</span>
        <input type="file" name="copia" accept="application/pdf,image/jpeg,image/png" multiple>
        <small>Persone fisiche: un PDF con fronte e retro, oppure due foto anche dal telefono. CIE, carta cartacea, passaporto o tessera sanitaria, fino a 10 MB. La copia viene conservata cifrata.</small></label>
      <button type="button" class="secondario" hx-post="/studio/clienti/nuovo/leggi" hx-encoding="multipart/form-data" hx-include="closest form" hx-target="#campi-nuovo-cliente" hx-swap="outerHTML">Leggi i dati dal documento</button>
    </div>
    {% include "_nuovo_cliente_campi.html" %}
    <div class="azioni"><button type="submit">Salva cliente</button><a href="/studio/clienti">Annulla</a></div>
  </form>
</section>
{% endblock %}
