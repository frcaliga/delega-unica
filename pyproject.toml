[project]
name = "delega-unica"
version = "0.1.0"
description = "SaaS per la gestione della delega unica AdE da parte degli intermediari"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "typer>=0.12",
    "lxml>=6.1.3",
    "cryptography>=50.0.2",
    "asn1crypto>=1.5.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"tests/*" = ["F811"]  # fixture pytest importate e riusate come parametri

[tool.pytest.ini_options]
testpaths = ["tests"]
